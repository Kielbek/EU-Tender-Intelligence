mail.paymentFailed.body=Hello,\n\nthe payment of {1} for the subscription of “{0}” in EU Tender Intelligence failed.\n\nStripe will retry automatically. To avoid falling back to the free plan, check or change the payment card:\n{2}\n(“Plan and billing” → “Manage billing”).
