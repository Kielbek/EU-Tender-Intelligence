mail.footer=EU Tender Intelligence\nThis is an automated message. If you did not expect it, you can ignore it.

mail.verify.subject=Confirm your e-mail address
mail.verify.body=Hello {0},\n\nconfirm your e-mail address to activate your EU Tender Intelligence account:\n{1}\n\nThe link is valid for 24 hours.

mail.exists.subject=Registration attempt for your account
mail.exists.body=Someone tried to register a new account with this e-mail address, but an account already exists.\n\nSign in: {0}\nForgot your password? {1}\n\nIf it was not you, no action is needed.

mail.reset.subject=Reset your password
mail.reset.body=We received a request to reset your password.\n\nSet a new password:\n{0}\n\nThe link is valid for 1 hour. If you did not request it, ignore this message – your password stays unchanged.

mail.passwordChanged.subject=Your password was changed
mail.passwordChanged.body=The password for your EU Tender Intelligence account was changed and all sessions were signed out.\n\nIf it was not you, reset your password immediately and contact support.

mail.invitation.subject=Invitation to an organization on EU Tender Intelligence
mail.invitation.body={0} invited you to join "{1}" on EU Tender Intelligence.\n\nAccept the invitation (sign in or create an account with this e-mail address):\n{2}\n\nThe invitation is valid for 7 days.
