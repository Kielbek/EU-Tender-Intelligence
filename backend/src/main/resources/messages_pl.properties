mail.invitation.body={0} zaprasza Cię do organizacji „{1}” w EU Tender Intelligence.\n\nPrzyjmij zaproszenie (zaloguj się lub załóż konto na ten adres e-mail):\n{2}\n\nZaproszenie jest ważne przez 7 dni.

