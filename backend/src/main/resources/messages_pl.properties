mail.passwordChanged.body=Hasło do Twojego konta w EU Tender Intelligence zostało zmienione, a wszystkie sesje wylogowane.\n\nJeśli to nie Ty, natychmiast zresetuj hasło i skontaktuj się z pomocą techniczną.

