spring:
  application:
    name: eti-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/eti}
    username: ${DATABASE_USER:eti}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      connection-timeout: 5000
  servlet:
    multipart:
      # Tender documents uploaded by users (also enforced in DocumentService).
      max-file-size: ${AI_MAX_UPLOAD_MB:25}MB
      max-request-size: ${AI_MAX_UPLOAD_MB:25}MB
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; entity mappings are verified by integration tests.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  messages:
    basename: messages
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

app:
  environment: ${APP_ENV:local}
  default-locale: ${APP_DEFAULT_LOCALE:pl}
  public-url: ${APP_PUBLIC_URL:http://localhost:4200}
  terms-version: ${APP_TERMS_VERSION:2026-11-draft}
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:true}
  security:
    jwt-secret: ${JWT_SECRET:}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    platform-admin-emails: ${PLATFORM_ADMIN_EMAILS:}
  mail:
    from: ${MAIL_FROM:EU Tender Intelligence <no-reply@localhost>}
  reference:
    cpv-sparql-url: https://publications.europa.eu/webapi/rdf/sparql
    ecb-daily-url: https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml
    ecb-history90d-url: https://www.ecb.europa.eu/stats/eurofxref/eurofxref-hist-90d.xml
    import-on-startup: ${REFERENCE_IMPORT_ON_STARTUP:true}
  ted:
    search-url: ${TED_SEARCH_URL:https://api.ted.europa.eu/v3/notices/search}
    initial-backfill-days: ${TED_INITIAL_BACKFILL_DAYS:3}
    schedule-enabled: ${TED_SCHEDULE_ENABLED:true}
  legal:
    operator-name: ${LEGAL_OPERATOR_NAME:}
    operator-address: ${LEGAL_OPERATOR_ADDRESS:}
    operator-tax-id: ${LEGAL_OPERATOR_TAX_ID:}
    operator-email: ${LEGAL_OPERATOR_EMAIL:}
    hosting-provider: ${LEGAL_HOSTING_PROVIDER:}
    email-provider: ${LEGAL_EMAIL_PROVIDER:}
  bzp:
    search-url: ${BZP_SEARCH_URL:https://ezamowienia.gov.pl/mo-board/api/v1/notice}
    initial-backfill-days: ${BZP_INITIAL_BACKFILL_DAYS:3}
    schedule-enabled: ${BZP_SCHEDULE_ENABLED:true}
    # The BZP API blocks clients that request too fast (403); keep a pause between pages.
    pause-between-pages: ${BZP_PAUSE_BETWEEN_PAGES:PT1.5S}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    analysis-model: ${AI_ANALYSIS_MODEL:claude-sonnet-5-5}
    analysis-effort: ${AI_ANALYSIS_EFFORT:medium}
    max-upload-mb: ${AI_MAX_UPLOAD_MB:25}
    workers: ${AI_WORKERS:2}
    refusal-fallback: ${AI_REFUSAL_FALLBACK:true}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    api-base: ${STRIPE_API_BASE:}
    automatic-tax: ${STRIPE_AUTOMATIC_TAX:true}
    price-starter-monthly: ${STRIPE_PRICE_STARTER_MONTHLY:}
    price-starter-yearly: ${STRIPE_PRICE_STARTER_YEARLY:}
    price-pro-monthly: ${STRIPE_PRICE_PRO_MONTHLY:}
    price-pro-yearly: ${STRIPE_PRICE_PRO_YEARLY:}
    price-business-monthly: ${STRIPE_PRICE_BUSINESS_MONTHLY:}
    price-business-yearly: ${STRIPE_PRICE_BUSINESS_YEARLY:}
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:true}
    scan-interval: ${NOTIFICATIONS_SCAN_INTERVAL:PT5M}
    digest-hour: ${NOTIFICATIONS_DIGEST_HOUR:7}
  integrations:
    smtp-host: ${SMTP_HOST:}
    s3-endpoint: ${S3_ENDPOINT:}
    s3-access-key: ${S3_ACCESS_KEY:}
    s3-secret-key: ${S3_SECRET_KEY:}
    s3-bucket: ${S3_BUCKET:}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
